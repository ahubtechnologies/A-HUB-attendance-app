<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-HUB | Attendance app</title>
    <link rel="icon" type="image/x-icon" href="logo/A-HUB 56 x 56 PX.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="container">
        <div class="navigation">
            <div class="logo">
                <img src="logo/A-HUB 56 x 56 PX.png" alt="A-hub logo">
            </div>
    
            <a class="logIn-btn-link">
                <button class="login-btn">
                </button>
            </a>
        </div>
        
        <div class="wrapper">
            <div class="action-bar">
                <div>ATTENDANCE SHEET</div>
                <div class="filter">
                    <div class="date-input-box">
                        <input type="text" id="datepicker" readonly />
                    </div>
                    <button id="refresh" class="refresh" title="refresh attendance data">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
    
            <div class="attendance-sheet">
                <div class="spinner">
                    <span class="loader-data"></span>
                    <p>fetching data...</p>
                </div>

                <div class="table-container">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Program</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="attribution">
            <p>&copy; 2025 | A-HUB TECHNOGIES. All rights reserved.</p>
        </div>
    </div>
